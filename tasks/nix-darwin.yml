- name: Check if Nix is installed
  command: which nix
  register: nix_installed
  changed_when: false
  ignore_errors: true
  tags:
    - setup
    - nix
    - additional

- name: Download Nix installer
  ansible.builtin.get_url:
    url: https://nixos.org/nix/install
    dest: /tmp/nix-install.sh
    mode: '0755'
  when: nix_installed.rc != 0
  tags:
    - setup
    - nix
    - additional

- name: Create venv and install pexpect for Nix installer task
  ansible.builtin.shell: |
    python3 -m venv /tmp/ansible-venv
    /tmp/ansible-venv/bin/pip install pexpect
  when: nix_installed.rc != 0
  tags:
    - setup
    - nix
    - additional

- name: Run Nix installer interactively
  ansible.builtin.expect:
    command: "bash /tmp/nix-install.sh"
    responses:
      "\\[y/n\\]": "y"
      "Nix won't work in active shell sessions until you restart them.": ""
    timeout: 600
  vars:
    ansible_python_interpreter: /tmp/ansible-venv/bin/python
  become: yes
  when: nix_installed.rc != 0
  tags:
    - setup
    - nix
    - additional

- name: Remove Nix installer script and venv
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/nix-install.sh
    - /tmp/ansible-venv
  when: nix_installed.rc != 0
  tags:
    - setup
    - nix
    - additional
