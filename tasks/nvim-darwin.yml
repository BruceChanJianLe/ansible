- name: Install neovim and dependencies
  community.general.homebrew:
    name:
      - neovim
      - ripgrep
      - fd
      - luarocks
      - imagemagick
    state: present
  when: not nix_darwin_run
  tags:
    - setup
    - nvim

- name: Install python virtualenv
  community.general.homebrew:
    name: virtualenv
    state: present
  when: not nix_darwin_run
  tags:
    - setup
    - nvim

- name: Clone nvim
  ansible.builtin.git:
    repo: 'https://github.com/brucechanjianle/nvim.git'
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
  tags:
    - setup
    - nvim

- name: Install nvim plugins
  become: no
  shell: 'nvim --headless "+Lazy! sync" +qa > /dev/null 2>&1'
  ignore_errors: true
  tags:
    - setup
    - nvim
