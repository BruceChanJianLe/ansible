- name: Install xsel and xclip
  become: yes
  apt:
    name:
      - xsel
      - xclip
  tags:
    - setup
    - tmux

- name: Clone tmux
  ansible.builtin.git:
    repo: 'https://github.com/brucechanjianle/tmux.git'
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/tmux"
  tags:
    - setup
    - tmux

- name: Install tmux
  become: yes
  community.general.snap:
    name: tmux
    state: present
    classic: true
  tags:
    - setup
    - tmux

- name: Install tmux plugins
  vars:
    tmux_plugin_dir: "{{ ansible_facts['env']['HOME'] }}/.config/tmux/plugins"
    tmux_plugins:
      - { name: "tpm", repo: "https://github.com/tmux-plugins/tpm.git", version: "master" }
      - { name: "tmux-resurrect", repo: "https://github.com/tmux-plugins/tmux-resurrect.git", version: "master" }
      - { name: "tmux-continuum", repo: "https://github.com/tmux-plugins/tmux-continuum.git", version: "master" }
      - { name: "tmux-syncer", repo: "https://github.com/brucechanjianle/tmux-syncer.git", version: "main" }
  ansible.builtin.git:
    repo: "{{ item['repo'] }}"
    dest: "{{ tmux_plugin_dir }}/{{ item['name'] }}"
    version: "{{ item['version'] }}"
    force: yes
  with_items: "{{ tmux_plugins }}"
  tags:
    - setup
    - tmux
