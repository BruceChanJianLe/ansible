- name: Install ghostty
  community.general.homebrew_cask:
    name: ghostty
    state: present
  tags:
    - setup
    - ghostty
    - additional

- name: Check if ghostty directory is empty
  find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty"
    file_type: any
  register: ghostty_contents
  tags:
    - setup
    - ghostty
    - additional

- name: Clone ghostty config repo if dir is empty
  git:
    repo: 'https://github.com/brucechanjianle/ghostty.git'
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty"
    force: yes
  when: ghostty_contents.matched == 0
  tags:
    - setup
    - ghostty
    - additional
