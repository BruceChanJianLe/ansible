# Core packages
- name: Install developer packages
  become: yes
  apt:
    name:
      - build-essential
      - cmake
      - cppcheck
      - gdb
      - git
      - ssh
      - libwrap0
      - ncurses-term 
      - openssh-server
      - openssh-sftp-server
      - ssh-import-id
      - libgoogle-glog-dev
      - libspnav-dev
      - libusb-dev
      - lsb-release
      - wget
      - net-tools
      - curl
      - bc
      - ansible
      - wl-clipboard
      - ccache
  tags:
    - setup
    - core

# software-properties-common is not available on Debian 13 (trixie)
- name: Install software-properties-common
  become: yes
  apt:
    name: software-properties-common
  when: not (ansible_distribution == "Debian" and ansible_distribution_major_version == "13")
  tags:
    - setup
    - core
