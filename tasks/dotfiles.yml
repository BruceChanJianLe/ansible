- name: Check .bashrc exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
  register: brc
  tags:
  - setup
  - dotfiles

- name: Make backup .bashrc
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc.ori"
    mode: 0664
    decrypt: false
  when: not nix_darwin_run and brc.stat.exists
  tags:
  - setup
  - dotfiles

- name: Check .bash_aliases exist
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases"
  register: bal
  tags:
  - setup
  - dotfiles

- name: Make backup .bash_aliases
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases"
    dest: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases.ori"
    mode: 0664
    decrypt: false
  when: not nix_darwin_run and bal.stat.exists
  tags:
  - setup
  - dotfiles

- name: Cloning dotfiles
  ansible.builtin.git:
    repo: 'https://github.com/BruceChanJianLe/dotfiles.git'
    dest: "{{ ansible_facts['env']['HOME'] }}/.dotfiles"
    recursive: yes
    update: yes
    accept_hostkey: yes
    version: master
    bare: true
  tags:
    - setup
    - dotfiles

- name: Checkout to your branch
  shell: /usr/bin/git --git-dir=$HOME/.dotfiles/ --work-tree=$HOME checkout "{{ dotfile_branch }}" -f
  tags:
    - setup
    - dotfiles

- name: Stop showing untrack files
  shell: /usr/bin/git --git-dir=$HOME/.dotfiles/ --work-tree=$HOME config --local status.showUntrackedFiles no
  tags:
    - setup
    - dotfiles

- name: Restore original .bashrc
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.bashrc.ori"
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    mode: 0664
    decrypt: false
  when: not nix_darwin_run and use_zsh and brc.stat.exists
  tags:
  - setup
  - dotfiles

- name: Restore original .bash_aliases
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases.ori"
    dest: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases"
    mode: 0664
    decrypt: false
  when: not nix_darwin_run and use_zsh and bal.stat.exists
  tags:
  - setup
  - dotfiles

- name: Check the nix-darwin flake arrived
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nix-darwin/flake.nix"
  register: nix_darwin_flake
  when: nix_darwin_run
  tags:
  - never
  - nix_darwin

- name: Fail early if the flake is missing
  ansible.builtin.fail:
    msg: >
      {{ ansible_facts['env']['HOME'] }}/.config/nix-darwin/flake.nix is absent.
      It must be tracked by the dotfiles repo (config add ~/.config/nix-darwin)
      for the checkout above to deliver it.
  when: nix_darwin_run and not nix_darwin_flake.stat.exists
  tags:
  - never
  - nix_darwin

# sudo nix run nix-darwin -- switch --flake ~/.config/nix-darwin#<user>
- name: Activate nix-darwin
  become: yes
  ansible.builtin.command:
    argv:
      - nix
      - run
      - nix-darwin
      - --
      - switch
      - --flake
      - "{{ ansible_facts['env']['HOME'] }}/.config/nix-darwin#{{ ansible_facts['env']['USER'] }}"
  when: nix_darwin_run
  tags:
  - never
  - nix_darwin
