- name: Check if Nix is installed
  command: which nix
  register: nix_installed
  changed_when: false
  ignore_errors: true
  tags:
    - setup
    - nix
    - additional

- name: Download Nix installer
  ansible.builtin.get_url:
    url: https://nixos.org/nix/install
    dest: /tmp/nix-install.sh
    mode: '0755'
  when: nix_installed.rc != 0
  tags:
    - setup
    - nix
    - additional

# ansible.builtin.expect below needs pexpect on the target. Debian pulls it in
# via the ansible package; Arch and macOS do not, so install it explicitly.
- name: Install pexpect, required by the Nix installer task
  vars:
    pexpect_pkg:
      Debian: python3-pexpect
      Archlinux: python-pexpect
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  ansible.builtin.package:
    name: "{{ pexpect_pkg[ansible_facts['os_family']] }}"
  when: nix_installed.rc != 0 and ansible_facts['os_family'] in pexpect_pkg
  tags:
    - setup
    - nix
    - additional

- name: Install pexpect on macOS, required by the Nix installer task
  ansible.builtin.pip:
    name: pexpect
    executable: pip3
  when: nix_installed.rc != 0 and ansible_facts['os_family'] == 'Darwin'
  tags:
    - setup
    - nix
    - additional

- name: Run Nix installer interactively
  ansible.builtin.expect:
    command: "bash /tmp/nix-install.sh --daemon"
    responses:
      "\\[y/n\\]": "y"
      "Nix won't work in active shell sessions until you restart them.": ""
      "I don't support your init system yet; you may want to add nix-daemon manually.": ""
    timeout: 600
  become: yes
  when: nix_installed.rc != 0
  tags:
    - setup
    - nix
    - additional

- name: Remove Nix installer script
  ansible.builtin.file:
    path: /tmp/nix-install.sh
    state: absent
  when: nix_installed.rc != 0
  tags:
    - setup
    - nix
    - additional
