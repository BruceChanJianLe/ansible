- hosts: all
  vars:
    dotfile_branch: "master"
    decrypt_bri: false
    decrypt_elip: false
    decrypt_cjl: false
    ripgrep_version: 15.1.0
    fd_version: 10.3.0
    use_zsh: true

  pre_tasks:
  - name: Check for classic sudo (sudo.ws)
    become: false
    ansible.builtin.stat:
      path: /usr/bin/sudo.ws
    register: sudo_ws
    tags: always

  - name: Prefer classic sudo where sudo-rs is the default
    become: false
    ansible.builtin.set_fact:
      ansible_become_exe: "{{ '/usr/bin/sudo.ws' if sudo_ws.stat.exists else '/usr/bin/sudo' }}"
    tags: always

  - name: Detect whether this is a nix_darwin run
    become: false
    ansible.builtin.set_fact:
      nix_darwin_run: "{{ 'nix_darwin' in ansible_run_tags }}"
    tags: always

  - name: Update Apt
    become: true
    apt:
      upgrade: no
      force_apt_get: true
      update_cache: true
      cache_valid_time: 86400 #One day
      state: present
    when: ansible_facts['os_family'] == "Debian"

  - name: Update Package Manager
    become: true
    pacman:
      update_cache: true
      state: present
    when: ansible_facts['os_family'] == "Archlinux"

  - name: Update Homebrew
    community.general.homebrew:
      update_homebrew: true
    when: ansible_facts['os_family'] == "Darwin"
    ignore_errors: true

  tasks:
    - include_tasks: setup-Debian.yml
      when: ansible_facts['os_family'] == 'Debian'
      tags: [setup, core, ssh, base16, nvim, tmux, zsh, dotfiles, private_aliases]

    - include_tasks: setup-additional-Debian.yml
      when: ansible_facts['os_family'] == 'Debian' and ansible_facts['architecture'] == "x86_64"
      tags: [brave, nix, ghostty, additional]

    - include_tasks: setup-Archlinux.yml
      when: ansible_facts['os_family'] == "Archlinux"
      tags: [setup, core, ssh, base16, nvim, tmux, zsh, dotfiles, hyprland, private_aliases]

    - include_tasks: setup-additional-Archlinux.yml
      when: ansible_facts['os_family'] == "Archlinux"
      tags: [brave, nix, ghostty, spotify, additional, yay]

    - include_tasks: setup-Darwin.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags: [setup, core, ssh, base16, nvim, tmux, zsh, dotfiles, private_aliases]

    - include_tasks: setup-additional-Darwin.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags: [nix, ghostty, additional]

    - include_tasks: setup-nix-Darwin.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags: [never, nix_darwin]
