# macOS cannot use vm-test.yml: GitHub's macOS runners do not expose nested
# virtualisation, so ansible-pull runs directly on the runner instead of inside
# a QEMU VM. The runner user has passwordless sudo, so no become-password setup
# is needed.
# Read .github/workflows/README.md before adding or removing a target.
---
name: macOS

on:
  push:
    branches: [macos]
    paths-ignore: ["**.md", LICENSE]
  workflow_dispatch:

jobs:
  pull:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Install ansible
        run: brew install ansible

      - name: ansible-pull
        timeout-minutes: 60
        run: |
          set -euo pipefail
          branch="${{ github.ref_name }}"
          repo="https://github.com/${{ github.repository }}"
          echo "Pulling $repo @ $branch"
          ansible-pull -U "$repo" -C "$branch"

      - name: Verify installed programs
        run: |
          set -euo pipefail
          bash -lc 'set -ex
            nvim --version | head -n1
            tmux -V
            /Applications/Ghostty.app/Contents/MacOS/ghostty --version
            nix --version
          '
