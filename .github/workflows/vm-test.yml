# Reusable workflow. Boots a pristine cloud image under QEMU/KVM and runs the
# documented `ansible-pull` one-liner inside it, as a normal user whose sudo
# asks for a password.
#
# Containers are deliberately not used: the playbook installs snaps and the
# multi-user nix daemon, both of which need a real kernel and systemd.
#
# One caller workflow per target, so each target gets its own status badge -
# see .github/workflows/README.md.
---
name: Reusable - ansible-pull in a VM

on:
  workflow_call:
    inputs:
      label:
        description: Human-readable target name, e.g. "Ubuntu 24.04"
        required: true
        type: string
      distro:
        description: ubuntu | arch - selects the admin group and the checks
        required: true
        type: string
      image_url:
        description: Cloud image to boot
        required: true
        type: string
      image_url_fallback:
        description: Used if image_url 404s (e.g. a release not yet published)
        required: false
        type: string
        default: ""

jobs:
  pull:
    name: ${{ inputs.label }}
    runs-on: ubuntu-24.04 # host only - the guest is what is under test
    timeout-minutes: 90

    env:
      VM: /mnt/vm
      SSH_OPTS: >-
        -p 2222 -i /mnt/vm/id_vm
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        -o LogLevel=ERROR

    steps:
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Fail here rather than silently falling back to software emulation,
          # which is ~20x slower and would just blow the job timeout instead.
          test -w /dev/kvm

      - name: Install host tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils ovmf

      - name: Fetch the cloud image
        run: |
          set -euo pipefail
          # /mnt is the runner's large ephemeral disk; / only has ~14 GB free,
          # which a full upgrade plus brave plus nix plus the snaps exceeds.
          sudo mkdir -p "$VM"
          sudo chown "$USER" "$VM"

          curl -fL --retry 3 '${{ inputs.image_url }}' -o "$VM/disk.qcow2" \
            || { [ -n '${{ inputs.image_url_fallback }}' ] \
                 && curl -fL --retry 3 '${{ inputs.image_url_fallback }}' -o "$VM/disk.qcow2"; }

          qemu-img resize "$VM/disk.qcow2" +40G # cloud-init growpart expands root on boot
          qemu-img info "$VM/disk.qcow2"

      - name: Seed cloud-init
        run: |
          set -euo pipefail
          case '${{ inputs.distro }}' in
            ubuntu) admin_group=sudo;  pkg_upgrade=false ;;
            # Arch is rolling, so a partial upgrade is a real risk: bring the
            # image fully up to date before the playbook touches pacman.
            arch)   admin_group=wheel; pkg_upgrade=true ;;
            *) echo "::error::unknown distro '${{ inputs.distro }}'"; exit 1 ;;
          esac

          ssh-keygen -t ed25519 -N '' -q -f "$VM/id_vm"

          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "VM_PASSWORD=$pw" >> "$GITHUB_ENV"

          cat > "$VM/user-data" <<EOF
          #cloud-config
          hostname: vm-test
          users:
            - name: tester
              groups: [$admin_group]
              shell: /bin/bash
              lock_passwd: false
              passwd: "$(openssl passwd -6 "$pw")"
              ssh_authorized_keys:
                - $(cat "$VM/id_vm.pub")
          chpasswd:
            expire: false
          write_files:
            # Password-required, never NOPASSWD. Explicit rather than relying on
            # the image's defaults, which differ between Ubuntu and Arch.
            - path: /etc/sudoers.d/90-$admin_group
              content: "%$admin_group ALL=(ALL:ALL) ALL\n"
              permissions: "0440"
          package_update: true
          package_upgrade: $pkg_upgrade
          # Exactly the bootstrap the README documents - nothing more, so a
          # missing dependency surfaces here instead of being papered over.
          packages: [ansible, git]
          EOF

          cloud-localds "$VM/seed.iso" "$VM/user-data"

      - name: Boot the VM
        run: |
          set -euo pipefail
          code=/usr/share/OVMF/OVMF_CODE_4M.fd
          vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          [ -f "$code" ] || code=/usr/share/OVMF/OVMF_CODE.fd
          [ -f "$vars" ] || vars=/usr/share/OVMF/OVMF_VARS.fd
          cp "$vars" "$VM/OVMF_VARS.fd"

          qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp "$(nproc)" -m 4096 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$code" \
            -drive if=pflash,format=raw,unit=1,file="$VM/OVMF_VARS.fd" \
            -drive file="$VM/disk.qcow2",if=virtio,format=qcow2 \
            -drive file="$VM/seed.iso",if=virtio,format=raw \
            -netdev user,id=n0,hostfwd=tcp::2222-:22 -device virtio-net-pci,netdev=n0 \
            -device virtio-rng-pci \
            -display none -serial "file:$VM/serial.log" -daemonize

          for _ in $(seq 1 60); do
            if ssh $SSH_OPTS -o ConnectTimeout=5 tester@127.0.0.1 true 2>/dev/null; then
              echo "SSH is up."
              exit 0
            fi
            sleep 10
          done
          echo "::error::VM did not come up within 10 minutes"
          tail -n 100 "$VM/serial.log"
          exit 1

      - name: Wait for cloud-init to finish
        run: |
          set -euo pipefail
          ssh $SSH_OPTS tester@127.0.0.1 'cloud-init status --wait'
          ssh $SSH_OPTS tester@127.0.0.1 '. /etc/os-release; echo "$PRETTY_NAME"; ansible --version | head -n1; git --version'

      - name: ansible-pull
        timeout-minutes: 60
        run: |
          set -euo pipefail
          branch="${{ github.ref_name }}"
          repo="https://github.com/${{ github.repository }}"
          echo "Pulling $repo @ $branch"

          # Written to a file inside the guest rather than passed as an argument,
          # so the password never appears in the guest's process list.
          #
          # This is a vars file consumed via `-e @file`, NOT
          # ANSIBLE_BECOME_PASSWORD_FILE / --become-password-file: those arrived
          # in ansible-core 2.12, and Ubuntu 22.04 ships ansible 2.10.8, where
          # they are silently ignored and every become task dies with
          # "sudo: a password is required". `-e @file` works on every version.
          printf 'ansible_become_password: "%s"\n' "$VM_PASSWORD" \
            | ssh $SSH_OPTS tester@127.0.0.1 'umask 077; cat > ~/.become_vars.yml'

          # -C is essential: a bare `ansible-pull -U ...` checks out the repo's
          # default branch, so without it this would silently test master.
          ssh $SSH_OPTS tester@127.0.0.1 "
            ansible-pull -U '$repo' -C '$branch' -e @\$HOME/.become_vars.yml
            rc=\$?
            rm -f \$HOME/.become_vars.yml
            exit \$rc
          " 2>&1 | tee "$VM/ansible-pull.log"

      - name: Verify installed programs
        run: |
          set -euo pipefail
          case '${{ inputs.distro }}' in
            ubuntu)
              checks='snap list ghostty && /snap/bin/ghostty --version && infocmp -x xterm-ghostty >/dev/null && brave-browser --version && nix --version' ;;
            # No brave on Arch: it is commented out of
            # setup-additional-Archlinux.yml in favour of building it with paru.
            arch)
              checks='ghostty --version && nix --version && command -v spotify-launcher' ;;
          esac

          # A fresh login shell, so anything the run added to the environment
          # (notably nix's /etc/profile.d/nix.sh) has to actually work.
          ssh $SSH_OPTS tester@127.0.0.1 "bash -lc 'set -ex; $checks'"

      - name: Collect the guest journal
        if: failure()
        run: |
          printf '%s\n' "$VM_PASSWORD" \
            | ssh $SSH_OPTS tester@127.0.0.1 'sudo -S -p "" journalctl -b --no-pager' \
            > "$VM/journal.log" || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs-${{ inputs.distro }}-${{ inputs.label }}
          path: |
            /mnt/vm/serial.log
            /mnt/vm/ansible-pull.log
            /mnt/vm/journal.log
          if-no-files-found: warn

      - name: Shut down the VM
        if: always()
        run: pkill -f qemu-system-x86_64 || true
